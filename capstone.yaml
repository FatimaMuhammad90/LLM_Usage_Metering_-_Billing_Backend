# capstone.yaml
name: Usage Metering & Billing Engine
version: 1.0.0

# How to run the application
run: uvicorn src.main:app --host 0.0.0.0 --port 8000

# How to seed the database
seed: python -m src.seed

# How to run tests
test: pytest tests/ -v

# Base URL for API endpoints
base_url: http://localhost:8000

# List of available endpoints
endpoints:
  - /tenants
  - /tenants/{tenant_id}/usage
  - /tenants/{tenant_id}/billing/checkout
  - /tenants/{tenant_id}/generate
  - /webhooks/stripe
  - /admin/alerts
  - /billing/success
  - /billing/cancel

# Environment variables required
env:
  - DATABASE_URL
  - STRIPE_SECRET_KEY
  - STRIPE_WEBHOOK_SECRET

# Database setup
database:
  type: postgresql
  setup: docker compose up -d
  migration: none

# Stripe setup
stripe:
  mode: test
  setup: stripe listen --forward-to http://localhost:8000/webhooks/stripe