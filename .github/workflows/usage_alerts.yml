name: Daily Usage Alerts

on:
  schedule:

    - cron: '0 9 * * *'
  workflow_dispatch:  

jobs:
  check-usage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run usage alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m jobs.usage_alerts